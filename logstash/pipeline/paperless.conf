# ############################
# Accept newline-delimited JSON logs from application services.
# ############################
input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

# ############################
# Store logs in daily Elasticsearch indices for inspection in Kibana.
# ############################
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "paperless-logs-%{+YYYY.MM.dd}"
  }
}
