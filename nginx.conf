server {
    listen 80;
    server_name localhost;

    # ############################
    # Root for static files
    # ############################
    root /usr/share/nginx/html;
    index index.html;

    # ############################
    # Serve static pages and fall back to the dashboard for unresolved paths.
    # ############################
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ############################
    # Health endpoint is mapped directly to the API's /health route.
    # ############################
    location = /api/health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # ############################
    # Forward controller requests while preserving the /api/ prefix.
    # ############################
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;



        # ############################
        # For file uploads
        # ############################


        client_max_body_size 50M;
    }

    # ############################
    # Revalidate scripts and styles so search updates are not pinned in browser caches.
    # ############################
    location ~* \.(js|css)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ############################
    # Cache image assets
    # ############################
    location ~* \.(png|jpg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ############################
    # Security headers
    # ############################
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ############################
    # Favicon fallback
    # ############################
    location = /favicon.ico {
        return 302 /icon.svg;
    }
}
