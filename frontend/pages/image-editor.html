<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan bearbeiten - Paperless</title>
<!-- ############################
     Shared styles and OCR runtime used by the scan editor.
     ############################ -->
<link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/document.css"><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
    /* ############################
       Main image workspace and OCR text-region markers.
       ############################ */
    body { overflow: hidden; }
    .image-editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: .8rem; }
    .image-editor-stage { height: calc(100vh - 185px); overflow: auto; background: #dde3da; border-radius: 18px; padding: 24px; text-align: center; }
    .image-wrap { position: relative; display: inline-block; background: white; box-shadow: 0 16px 42px rgba(24,39,25,.18); }
    .image-wrap img { display: block; max-width: 100%; height: auto; }
    .image-box { position: absolute; border: 1px dashed #2768c5; background: rgba(74,134,255,.17); cursor: move; min-width: 20px; min-height: 16px; color: transparent; }
    .image-box.selected { border: 2px solid #2f7d4a; background: rgba(47,125,74,.22); }

    /* ############################
       Text inspector and narrow-screen layout.
       ############################ */
    .image-inspector { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 1rem; height: calc(100vh - 185px); overflow: auto; }
    .image-inspector textarea, .image-inspector input { width: 100%; margin: .4rem 0 .8rem; }
    .editor-hint { font-size: .88rem; color: #536252; line-height: 1.5; margin: .5rem 0 1rem; }
    .image-empty { display: grid; place-items: center; height: 100%; color: #536252; }
    @media (max-width: 820px) {
        body { overflow: auto; }
        .image-editor-layout { grid-template-columns: 1fr; }
        .image-inspector { height: auto; }
        .image-editor-stage { height: 62vh; }
    }
</style></head>
<body><!-- ############################
     Editor actions stay in the header for quick access.
     ############################ --><header class="workspace-header"><div class="container shell-bar"><div class="brand-cluster"><div class="brand-mark">P</div><div class="brand-copy"><span class="eyebrow">Dokumente</span><strong>Scan bearbeiten</strong></div></div><div class="top-actions"><button id="ocrImage" class="btn btn-secondary btn-small">Text erkennen</button><button id="saveImage" class="mini-cta">Kopie speichern</button></div></div></header>
<!-- ############################
     Image preview and the text inspector used to edit OCR regions.
     ############################ -->
<main>
    <div class="container">
        <div id="imageStatus" role="status">Bild wird geladen…</div>
        <div class="image-editor-layout">
            <section class="image-editor-stage">
                <div id="imageWrap" class="image-wrap"><img id="imageCanvas" alt="Zu bearbeitender Scan"></div>
            </section>
            <aside class="image-inspector">
                <strong>Text im Scan ändern</strong>
                <p class="editor-hint">Erkannte Textstellen sind blau markiert. Klicke eine Stelle an, ändere den Text und speichere. Beim Speichern wird die alte Schrift aus dem Bild rekonstruiert.</p>
                <label for="imageText">Neuer Text</label>
                <textarea id="imageText" rows="5" placeholder="Markierten Text auswählen"></textarea>
                <label for="imageColor">Textfarbe</label>
                <input id="imageColor" type="color" value="#1f2d1f">
                <button id="applyImageText" class="btn btn-primary" style="width:100%">Änderung übernehmen</button>
            </aside>
        </div>
    </div>
</main>
<!-- ############################
     Shared API client first; image editor behavior second.
     ############################ -->
<script src="../js/api-client.js"></script>
<script src="../js/image-editor.js"></script>
</body></html>
