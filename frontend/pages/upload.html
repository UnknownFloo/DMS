<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document - Paperless</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/upload.css">
</head>
<body>
    <header class="workspace-header">
        <div class="container shell-bar">
            <div class="brand-cluster">
                <div class="brand-mark">P</div>
                <div class="brand-copy">
                    <span class="eyebrow">workspace</span>
                    <strong>Paperless</strong>
                </div>
            </div>

            <nav class="nav-pills" aria-label="Main navigation">
                <a href="../index.html">Overview</a>
                <a href="upload.html" class="active">Upload</a>
                <a href="documents.html">Documents</a>
                <a href="collections.html">Collections</a>
            </nav>

            <div class="top-actions">
                <button class="status-pill" type="button"><span class="status-dot"></span>Ready</button>
                <a href="upload.html" class="mini-cta">New Doc</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>Upload Document</h1>
            </div>

            <div class="form-container">
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Select File</label>
                        <div class="file-upload-area" id="uploadArea">
                            <div class="file-upload-icon">📁</div>
                            <div class="file-upload-text">Click to upload or drag files here</div>
                            <div class="file-upload-hint">PDF, TXT, DOCX (max 50MB)</div>
                            <label class="file-picker-button" for="fileInput">Choose file</label>
                            <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.png,.jpg">
                        </div>
                    </div>

                    <ul id="fileList" class="file-list"></ul>

                    <div class="form-group">
                        <label for="docDescription">Description (optional)</label>
                        <textarea id="docDescription" placeholder="Add a description for this document..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location='../index.html'">Cancel</button>
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/api-client.js"></script>
    <script src="../js/upload.js"></script>
</body>
</html>
